name: Deploy a GitHub Pages

# Compila el frontend y publica dist/ en GitHub Pages.
#
# OJO: este workflow NO corre solo. La cuenta tiene Actions bloqueado por un
# problema de facturacion ("billing issue"), asi que cada push a main dejaba un
# run fallido y su correspondiente correo de error, sin publicar nada. El sitio
# se publica con `npm run deploy` (scripts/deploy-pages.mjs), que sube dist/ a
# la rama gh-pages sin pasar por Actions.
#
# El despliegue automatico se hace mientras tanto desde el equipo: el hook
# scripts/hooks/pre-push ejecuta esa misma publicacion en cada push a main.
#
# Cuando Actions vuelva a estar disponible: devolver el disparador `push` de
# abajo, quitar el hook (y su linea `prepare` del package.json) y cambiar
# Settings > Pages a "GitHub Actions" como origen, porque hoy Pages sirve la
# rama gh-pages.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empuja varias veces seguidas, se cancela el despliegue anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      # GitHub Pages no reescribe rutas: sin esto, recargar /app/pedidos da 404.
      # Sirviendo el mismo index.html como 404.html, React Router resuelve la ruta.
      - name: Fallback de rutas del SPA
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
